<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Details | Sahu Admin</title>

    <link rel="icon"
          href="../../images/logo.png">

    <link rel="stylesheet"
          href="../../css/style.css">

    <link rel="stylesheet"
          href="../../css/admin.css">

    <link rel="stylesheet"
          href="../../css/admin-order-details.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">

            <h2>

                Sahu <span>Admin</span>

            </h2>

        </div>

        <ul class="menu">

            <li>

                <a href="dashboard.html">

                    <i class="fas fa-chart-line"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="products.html">

                    <i class="fas fa-box"></i>

                    Products

                </a>

            </li>

            <li>

                <a href="orders.html"
                   class="active">

                    <i class="fas fa-shopping-cart"></i>

                    Orders

                </a>

            </li>

            <li>

                <a href="users.html">

                    <i class="fas fa-users"></i>

                    Users

                </a>

            </li>

        </ul>

        <div class="sidebar-footer">

            <img src="../../images/avatar.png"
                 alt="Admin">

            <div>

                <h4>

                    Admin User

                </h4>

                <span>

                    Administrator

                </span>

            </div>

        </div>

    </aside>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <!-- HEADER -->

        <header class="page-header">

            <div class="page-left">

                <button
                    class="menu-btn">

                    <i class="fas fa-bars"></i>

                </button>

                <a href="orders.html"
                   class="back-btn">

                    <i class="fas fa-arrow-left"></i>

                    Back to Orders

                </a>

                <div>

                    <h1>

                        Order Details

                    </h1>

                    <p>

                        View complete customer, payment and shipping information.

                    </p>

                </div>

            </div>

            <div class="page-right">

                <button
                    id="printLabelBtn"
                    class="btn success-btn">

                    <i class="fas fa-print"></i>

                    Print Label

                </button>

                <button
                    id="printInvoiceBtn"
                    class="btn primary-btn">

                    <i class="fas fa-file-invoice"></i>

                    Print Invoice

                </button>

            </div>

        </header>

        <!-- =========================
             ORDER DETAILS
        ========================== -->

        <section id="order-details">

            <div class="loading">

                <div class="loader"></div>

                <h2>

                    Loading Order...

                </h2>

                <p>

                    Please wait while we fetch order details.

                </p>

            </div>

        </section>

    </main>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="../../js/api.js"></script>

    <script src="../../js/admin-order-details.js"></script>

</body>

</html>

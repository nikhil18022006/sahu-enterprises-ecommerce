<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Details | Sahu Admin</title>

    <link rel="icon"
          href="../../images/logo.png">

    <link rel="stylesheet"
          href="../../css/style.css">

    <link rel="stylesheet"
          href="../../css/admin.css">

    <link rel="stylesheet"
          href="../../css/admin-order-details.css">

</head>

<body>

    <!-- ===========================
         SIDEBAR
    ============================ -->

    <aside class="sidebar">

        <div class="logo">

            <h2>Sahu Admin</h2>

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="orders.html"
                   class="active">
                    Orders
                </a>
            </li>

            <li>
                <a href="users.html">
                    Users
                </a>
            </li>

        </ul>

    </aside>

    <!-- ===========================
         MAIN CONTENT
    ============================ -->

    <main class="main-content">

        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="page-left">

                <a href="orders.html"
                   class="back-btn">

                    ← Back to Orders

                </a>

                <div>

                    <h1>

                        Order Details

                    </h1>

                    <p>

                        View complete customer, payment and shipping information.

                    </p>

                </div>

            </div>

            <div class="page-right">

                <button
                    id="printLabelBtn"
                    class="btn success-btn">

                    🖨 Print Label

                </button>

                <button
                    id="printInvoiceBtn"
                    class="btn primary-btn">

                    📄 Print Invoice

                </button>

            </div>

        </section>

        <!-- ORDER DETAILS -->

        <section id="order-details">

            <div class="loading">

                <div class="loader"></div>

                <h2>

                    Loading Order...

                </h2>

                <p>

                    Please wait while we fetch order information.

                </p>

            </div>

        </section>

    </main>

    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="../../js/api.js"></script>

    <script src="../../js/admin-order-details.js"></script>

</body>

</html>

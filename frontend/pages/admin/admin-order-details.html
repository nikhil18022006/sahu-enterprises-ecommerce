<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Order Details | Admin Panel
    </title>

    <link rel="icon"
        type="image/png"
        href="../images/logo.png">

    <link rel="stylesheet"
        href="../css/style.css">

    <link rel="stylesheet"
        href="../css/admin.css">

    <link rel="stylesheet"
        href="../css/admin-order-details.css">

</head>

<body>

    <!-- ===========================
         ADMIN LAYOUT
    ============================ -->

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <img src="../images/logo.png"
                    alt="Logo">

                <h2>Sahu Admin</h2>

            </div>

            <nav>

                <ul>

                    <li>

                        <a href="dashboard.html">

                            Dashboard

                        </a>

                    </li>

                    <li>

                        <a href="products.html">

                            Products

                        </a>

                    </li>

                    <li>

                        <a href="users.html">

                            Users

                        </a>

                    </li>

                    <li>

                        <a href="orders.html"
                            class="active">

                            Orders

                        </a>

                    </li>

                    <li>

                        <a href="../index.html">

                            Visit Store

                        </a>

                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main Content -->

        <main class="admin-main">

            <!-- Header -->

            <div class="admin-header">

                <div>

                    <h1>

                        Order Details

                    </h1>

                    <p>

                        View customer information,
                        shipping address,
                        ordered products,
                        invoice and shipping label.

                    </p>

                </div>

                <a href="orders.html"
                    class="back-btn">

                    ← Back to Orders

                </a>

            </div>

            <!-- Dynamic Order -->

            <section id="order-details">

                <div class="loading">

                    <h2>

                        Loading Order...

                    </h2>

                    <p>

                        Please wait...

                    </p>

                </div>

            </section>

        </main>

    </div>

    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="../js/api.js"></script>

    <script src="../js/admin-order-details.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | Sahu Enterprises</title>

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/admin-dashboard.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>Sahu Admin</h2>

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html" class="active">
                    Products
                </a>
            </li>

            <li>
                <a href="orders.html">
                    Orders
                </a>
            </li>

            <li>
                <a href="users.html">
                    Users
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="topbar">

            <h1>Manage Products</h1>

            <button onclick="window.location.href='add-product.html'">

                + Add Product

            </button>

        </header>

        <!-- Search -->

        <div class="search-box">

            <input type="text" id="search-input" placeholder="Search products...">

        </div>

        <!-- Product Table -->

        <div class="table-container">

            <table class="product-table">

                <thead>

                    <tr>

                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="product-list">

                    <!-- Products will come from JavaScript -->

                </tbody>

            </table>

        </div>

    </main>
    <script src="../../js/components.js"></script>
    <script src="../../js/admin-products.js"></script>

</body>

</html>
